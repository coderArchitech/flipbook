name: Flipbook checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flipbook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: flipbook/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:e2e
      - run: docker compose build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            flipbook/playwright-report/
            flipbook/test-results/
          retention-days: 7
