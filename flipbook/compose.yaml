name: flipbook
services:
  app:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FLIPBOOK_PORT:-3000}:3000"
    environment:
      PUBLIC_URL: "http://localhost:${FLIPBOOK_PORT:-3000}"
      NODE_ENV: production
      HOST: 0.0.0.0
      DATA_DIR: /app/data
    volumes:
      - flipbook-data:/app/data
    tmpfs:
      - /tmp:size=536870912,mode=1777
    shm_size: 256mb
    mem_limit: 1g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  flipbook-data:
