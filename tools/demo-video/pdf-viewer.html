<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slow Living — The Autumn Edit.pdf</title>
<style>
  :root { --bg: #3b3f45; --bar: #2b2e33; --fg: #eef0f2; --muted: #aab0b8; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 "DM Sans", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 24px; background: var(--bar); box-shadow: 0 2px 8px #0005; }
  header strong { font-weight: 600; }
  header span { color: var(--muted); font-variant-numeric: tabular-nums; }
  main { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 28px 0 80px; }
  .page { position: relative; box-shadow: 0 6px 24px #0007; background: white; }
  .page canvas { display: block; }
  .textLayer { position: absolute; inset: 0; overflow: hidden; line-height: 1; opacity: 1; text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0; caret-color: CanvasText; z-index: 2; }
  .textLayer :is(span, br) { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
  .textLayer ::selection { background: rgba(0, 110, 255, .32); }
  .textLayer .endOfContent { display: block; position: absolute; inset: 100% 0 0; z-index: -1; cursor: default; user-select: none; }
  .link { position: absolute; z-index: 3; border-radius: 3px; }
  .link.show { outline: 2px solid #2f7de1; background: rgba(47, 125, 225, .12); }
  .tip { position: absolute; z-index: 4; transform: translateY(-120%); background: #1d2026; color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 13px; white-space: nowrap; pointer-events: none; }
</style>
</head>
<body>
<header><strong>Slow Living — The Autumn Edit.pdf</strong><span id="meta">Loading…</span></header>
<main id="pages"></main>
<script type="module">
  import * as pdfjs from "/__demo/pdf.mjs";
  pdfjs.GlobalWorkerOptions.workerSrc = "/__demo/pdf.worker.mjs";
  const pdf = await pdfjs.getDocument("/__demo/edition.pdf").promise;
  const first = await pdf.getPage(1), base = first.getViewport({ scale: 1 });
  document.getElementById("meta").textContent =
    `${pdf.numPages} pages · A4 ${Math.round(base.width / 72 * 25.4)} × ${Math.round(base.height / 72 * 25.4)} mm`;
  const scale = 820 / base.width, ratio = window.devicePixelRatio || 1;
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n), viewport = page.getViewport({ scale });
    const box = document.createElement("section");
    box.className = "page"; box.id = "page-" + n;
    box.style.width = viewport.width + "px"; box.style.height = viewport.height + "px";
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width * ratio; canvas.height = viewport.height * ratio;
    canvas.style.width = viewport.width + "px"; canvas.style.height = viewport.height + "px";
    box.append(canvas);
    document.getElementById("pages").append(box);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport, transform: [ratio, 0, 0, ratio, 0, 0] }).promise;
    const layer = document.createElement("div");
    layer.className = "textLayer";
    layer.style.setProperty("--scale-factor", scale);
    box.append(layer);
    await new pdfjs.TextLayer({ textContentSource: page.streamTextContent(), container: layer, viewport }).render();
    for (const a of await page.getAnnotations()) {
      if (a.subtype !== "Link") continue;
      const [x1, y1, x2, y2] = pdfjs.Util.normalizeRect(viewport.convertToViewportRectangle(a.rect));
      const link = document.createElement("div");
      link.className = "link";
      link.dataset.url = a.url || (a.dest ? "Go to page in this PDF" : "");
      Object.assign(link.style, { left: x1 + "px", top: y1 + "px", width: x2 - x1 + "px", height: y2 - y1 + "px" });
      link.addEventListener("mouseenter", () => {
        link.classList.add("show");
        const tip = document.createElement("div");
        tip.className = "tip"; tip.textContent = link.dataset.url;
        tip.style.left = x1 + "px"; tip.style.top = y1 + "px";
        box.append(tip); link._tip = tip;
      });
      link.addEventListener("mouseleave", () => { link.classList.remove("show"); link._tip?.remove(); });
      box.append(link);
    }
  }
  document.body.dataset.ready = "true";
</script>
</body>
</html>
